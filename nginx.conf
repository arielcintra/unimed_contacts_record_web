server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # CSV uploads go through this proxy.
    client_max_body_size 10m;

    # Docker's internal DNS. With a variable in proxy_pass, nginx resolves "api" at request time
    # (cached for 10s) instead of only at startup, so a recreated API container is found again.
    resolver 127.0.0.11 valid=10s;

    # Same-origin API calls: no CORS and no API URL baked into the bundle.
    location /api/ {
        set $api_upstream http://api:8080;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback for client-side routes.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
